# The browser build (docs/web.md): `trunk build --release`, `trunk serve --release`.
[build]
target = "web/index.html"
dist = "dist/web"

# The download page's version (web/download.html): the one in Cargo.toml, so the release links
# follow it. Then gzipped copies of the wasm and scripts beside them, for nginx's gzip_static
# (docs/web.md).
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", """
v=$(sed -n 's/^version *= *"\\([^"]*\\)".*/\\1/p' Cargo.toml | head -n1)
printf 'window.SM89_VERSION = "%s";\\n' "$v" > "$TRUNK_STAGING_DIR/version.js"
gzip -9 -k -f "$TRUNK_STAGING_DIR"/*.wasm "$TRUNK_STAGING_DIR"/*.js
"""]
