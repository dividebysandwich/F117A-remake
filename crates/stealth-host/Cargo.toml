[package]
name = "stealth-host"
version.workspace = true
edition.workspace = true
description = "Stealth Mission 89 campaign host: the dynamic campaign driving the combat simulation, without the renderer"

[dependencies]
stealth-formats.workspace = true
stealth-mission = { path = "../stealth-mission" }
stealth-sim = { path = "../stealth-sim" }
stealth-campaign = { path = "../stealth-campaign" }
serde.workspace = true
ron.workspace = true
anyhow.workspace = true
serde_json = "1"
dirs = "6"

# The browser build keeps saves in localStorage (`store`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
js-sys = "0.3"
