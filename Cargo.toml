[workspace]
members = [".", "crates/bevy_fast_clouds", "crates/stealth-campaign", "crates/stealth-formats", "crates/stealth-mission", "crates/stealth-sim"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.3.0"

[workspace.dependencies]
stealth-formats = { path = "crates/stealth-formats" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
anyhow = "1"

[package]
name = "stealth-mission-89"
version.workspace = true
edition.workspace = true

[features]
default = ["dev", "xr"]
dev = ["bevy/dynamic_linking"]
# OpenXR support (`--vr`); the loader is opened at runtime, so builds without a runtime still work.
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]

[dependencies]
# trace: spans for every system and render node (timed with SM89_PROFILE, see src/profile.rs).
bevy = { version = "0.19.1", features = ["flac", "trace"] }
bevy_egui = "0.42"
serde.workspace = true
ron.workspace = true
serde_json = "1"
stealth-formats.workspace = true
stealth-mission = { path = "crates/stealth-mission" }
stealth-sim = { path = "crates/stealth-sim" }
stealth-campaign = { path = "crates/stealth-campaign" }
bevy_fast_clouds = { path = "crates/bevy_fast_clouds" }
anyhow.workspace = true
rand = "0.9"
gilrs = "0.11"
dirs = "6"
bevy_mod_openxr = { version = "0.6", optional = true }
bevy_mod_xr = { version = "0.6", optional = true }
openxr = { version = "0.21", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Closes the console window of a game started from Explorer (src/win_console.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
# Links the icon, manifest and version (packaging/windows) into stealth-mission-89.exe.
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
