[workspace]
members = [".", "crates/stealth-formats", "crates/stealth-mission", "crates/stealth-sim"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.1"

[workspace.dependencies]
stealth-formats = { path = "crates/stealth-formats" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
anyhow = "1"

[package]
name = "stealth-mission-89"
version.workspace = true
edition.workspace = true

[features]
default = ["dev", "xr"]
dev = ["bevy/dynamic_linking"]
# OpenXR support (`--vr`); the loader is opened at runtime, so builds without a runtime still work.
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]

[dependencies]
bevy = { version = "0.19.1", features = ["flac"] }
bevy_egui = "0.42"
serde.workspace = true
ron.workspace = true
serde_json = "1"
stealth-formats.workspace = true
stealth-mission = { path = "crates/stealth-mission" }
stealth-sim = { path = "crates/stealth-sim" }
anyhow.workspace = true
rand = "0.9"
gilrs = "0.11"
dirs = "6"
bevy_mod_openxr = { version = "0.6", optional = true }
bevy_mod_xr = { version = "0.6", optional = true }
openxr = { version = "0.21", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
