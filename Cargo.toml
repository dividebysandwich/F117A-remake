[workspace]
members = [".", "crates/f117-formats", "crates/f117-mission", "crates/f117-sim"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
f117-formats = { path = "crates/f117-formats" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
anyhow = "1"

[package]
name = "f117"
version.workspace = true
edition.workspace = true

[features]
default = ["dev", "xr"]
dev = ["bevy/dynamic_linking"]
# OpenXR support (`--vr`); the loader is opened at runtime, so builds without a runtime still work.
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]

[dependencies]
bevy = { version = "0.19.1", features = ["wav"] }
bevy_egui = "0.42"
serde.workspace = true
ron.workspace = true
serde_json = "1"
f117-formats.workspace = true
f117-mission = { path = "crates/f117-mission" }
f117-sim = { path = "crates/f117-sim" }
anyhow.workspace = true
rand = "0.9"
bevy_mod_openxr = { version = "0.6", optional = true }
bevy_mod_xr = { version = "0.6", optional = true }
openxr = { version = "0.21", optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
